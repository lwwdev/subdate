name: testflight

# run by hand from the actions tab. needs an apple developer account,
# see "ios / testflight" in the readme for the secrets
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: check secrets
        run: |
          for v in KEY_ID ISSUER_ID KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::missing secret for $v, see the readme"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # generates the xcconfig + pods, signing happens in xcodebuild below
      - run: flutter build ios --release --config-only --build-number=${{ github.run_number }}
      - name: api key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
      - name: archive
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive
      - name: upload to app store connect
        run: |
          plutil -replace teamID -string "$TEAM_ID" ios/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
      - if: always()
        run: rm -rf ~/private_keys
